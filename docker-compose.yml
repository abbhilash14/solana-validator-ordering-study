version: '3.8'

services:
  solana-validator-ordering:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solana-validator-ordering-study
    environment:
      - DRY_RUN=true
      - SOLANA_RPC=https://api.mainnet-beta.solana.com
    volumes:
      - ./MEASUREMENT_REPORT.json:/app/MEASUREMENT_REPORT.json
    restart: "no"
